<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>添加菜谱</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 700px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form p {
            margin-bottom: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: white;
            background-color: #888;
            padding: 10px 16px;
            border-radius: 5px;
        }

        .back-link:hover {
            background-color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>添加菜谱</h1>
        {% if error_message %}
            <p style="color: red; text-align: center;">{{ error_message }}</p>
        {% endif %}

    <form method="post">
    {% csrf_token %}
        <p>菜名：<input type="text" name="name" value="{{ form_data.name }}"></p>
        <p>食材：<textarea name="ingredients" rows="4">{{ form_data.ingredients }}</textarea></p>
        <p>步骤：<textarea name="steps" rows="6">{{ form_data.steps }}</textarea></p>
        <p>烹饪时间（分钟）：<input type="number" name="cooking_time" value="{{ form_data.cooking_time }}"></p>
        <button type="submit">提交</button>
    </form>

        <a href="/recipes/" class="back-link">返回菜谱列表</a>
    </div>
</body>
</html>
