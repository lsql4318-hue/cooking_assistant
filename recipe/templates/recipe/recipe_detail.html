<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ recipe.name }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 800px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
        }

        p {
            font-size: 16px;
            line-height: 1.8;
            color: #555;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            background-color: #4CAF50;
            padding: 10px 16px;
            border-radius: 5px;
        }

        .back-link:hover {
            background-color: #45a049;
        }

        .section-title {
            color: #333;
            margin-top: 20px;
        }

        .content-box {
            background-color: #fafafa;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ recipe.name }}</h1>

        <h3 class="section-title">食材</h3>
        <div class="content-box">
            <p>{{ recipe.ingredients }}</p>
        </div>

        <h3 class="section-title">步骤</h3>
        <div class="content-box">
            <p>{{ recipe.steps }}</p>
        </div>

        <h3 class="section-title">烹饪时间</h3>
        <div class="content-box">
            <p>{{ recipe.cooking_time }} 分钟</p>
        </div>

        <a href="/recipes/" class="back-link">返回菜谱列表</a>
    </div>
</body>
</html>
