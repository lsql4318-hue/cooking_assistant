<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>菜谱列表</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 300px;
            padding: 8px;
            font-size: 16px;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .recipe-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: #fafafa;
        }

        .recipe-card h2 a {
            text-decoration: none;
            color: #2c3e50;
        }

        .recipe-card h2 a:hover {
            color: #4CAF50;
        }

        .recipe-card p {
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>菜谱列表</h1>

        <div style="text-align: right; margin-bottom: 15px;">
    {% if request.user.is_authenticated %}
        当前用户：{{ request.user.username }}
        <a href="/logout/" style="margin-left: 10px; color: red;">退出登录</a>
    {% else %}
        <a href="/login/">登录</a>
        <a href="/register/" style="margin-left: 10px;">注册</a>
    {% endif %}
</div>

        <div style="text-align: center; margin-bottom: 20px;">
    <form action="/search/" method="get" style="display: inline-block; margin-right: 10px;">
        <input type="text" name="keyword" placeholder="请输入菜名">
        <button type="submit">搜索</button>
    </form>

    <a href="/add_recipe/" style="
        display: inline-block;
        padding: 8px 16px;
        background-color: #4CAF50;
        color: white;
        text-decoration: none;
        border-radius: 5px;
    ">添加菜谱</a>
</div>

        <hr>

        {% for recipe in recipes %}
            <div class="recipe-card">
                <h2><a href="/recipe/{{ recipe.id }}/">{{ recipe.name }}</a></h2>
                <p><strong>食材：</strong>{{ recipe.ingredients }}</p>
                <p><strong>步骤：</strong>{{ recipe.steps }}</p>
                <p><strong>烹饪时间：</strong>{{ recipe.cooking_time }} 分钟</p>
            </div>
        {% empty %}
            <p>暂无菜谱数据</p>
        {% endfor %}
    </div>
</body>
</html>
